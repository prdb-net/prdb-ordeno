# ADR 0014: the OpenAPI document and the types generated from it are committed,
# so what this workflow has to catch is an endpoint that changed without them
# being regenerated. Forgetting is a red build here rather than a stale frontend
# that compiles against a shape the backend no longer sends.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build, test and check the API contract
    runs-on: ubuntu-latest

    # This job passes in about five minutes. The default is six hours, which is
    # long enough for a step that hangs to look like a step that is working.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Prdb.Ordeno.Frontend/package-lock.json

      - name: Install the frontend's dependencies
        run: npm ci
        working-directory: src/Prdb.Ordeno.Frontend

      # The runtime image ships these, and the tests that read a picture size
      # out of a real file need the same pair here. Faking them would test the
      # parser rather than the question, and the question is what decides
      # whether somebody's video is filed.
      #
      # They still come from the archives rather than from a binary pinned here,
      # for the reason ADR 0013 gives for the image: a distribution build is the
      # ffmpeg the tool actually runs, and it is kept current by somebody else.
      # Both stalls that prompted this installed in about two minutes when the
      # step was simply run again, so where the binary comes from was never the
      # problem — a step that waited for it forever was. So that is what is
      # bounded: apt drops a connection that has stopped answering instead of
      # holding it open, three attempts cover a mirror that is briefly gone, and
      # the limit on the step turns anything worse into a red job somebody can
      # re-run rather than a check that reads as "still building" until GitHub's
      # six-hour limit kills it.
      - name: Install ffmpeg and ffprobe
        timeout-minutes: 12
        run: |
          apt_get() {
            seconds=$1
            shift
            sudo timeout "$seconds" apt-get \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              -o Acquire::Retries=2 \
              "$@"
          }

          # How long is left of the budget, in a piece no attempt may exceed,
          # and never zero -- `timeout 0` means no limit at all, which is the
          # one thing this step must not do.
          slice() {
            remaining=$((deadline - $(date +%s)))
            if [ "$remaining" -gt 180 ]; then echo 180
            elif [ "$remaining" -gt 10 ]; then echo "$remaining"
            else echo 10
            fi
          }

          # ffmpeg and its dependencies are a hundred megabytes or so, and a
          # download that is cut off part way stays in apt's cache, so the next
          # attempt carries on rather than starting again. That is why this is
          # one budget with attempts inside it and not a fixed number of tries:
          # against a mirror that is gone the attempts fail fast and the budget
          # is never spent, and against one that is merely crawling they add up
          # to one download instead of three abandoned ones.
          # Five, because the budget alone does not bound an attempt that
          # fails immediately: a mirror answering with an error would otherwise
          # be asked sixty times in those nine minutes, which is hammering it
          # rather than retrying it. Whichever bound is reached first ends the
          # step -- five quick failures are red in a couple of minutes, and one
          # slow download gets the whole budget.
          deadline=$(($(date +%s) + 540))
          attempts=5
          attempt=0

          while [ "$attempt" -lt "$attempts" ] && [ "$((deadline - $(date +%s)))" -gt 30 ]; do
            attempt=$((attempt + 1))

            if apt_get "$(slice)" update && apt_get "$(slice)" install --no-install-recommends -y ffmpeg; then
              ffmpeg -version | head -n 1
              ffprobe -version | head -n 1
              exit 0
            fi

            echo "::warning::Installing ffmpeg failed or stalled on attempt ${attempt} of ${attempts}; $((deadline - $(date +%s)))s of the budget left."

            # An attempt the timeout killed can leave dpkg half-configured, and
            # the next one would then fail on that rather than on the archives
            # it is here to retry.
            sudo dpkg --configure -a || true
            sleep 15
          done

          echo "::error::ffmpeg could not be installed in ${attempt} attempts inside nine minutes; the apt output above is the failure. Usually this is a transient archive or DNS problem on the runner, so re-running the job is the first thing to try."
          exit 1

      # Writes src/Prdb.Ordeno.Host/openapi.json on the way through.
      - name: Build
        run: dotnet build

      - name: Test
        run: dotnet test --no-build

      - name: The committed API contract matches the code
        working-directory: src/Prdb.Ordeno.Frontend
        run: |
          npm run generate:api
          if ! git diff --exit-code -- ../Prdb.Ordeno.Host/openapi.json src/api/schema.d.ts; then
            echo "::error::The API contract is stale. Run 'npm run generate:api' in src/Prdb.Ordeno.Frontend and commit the result."
            exit 1
          fi

      - name: Lint the frontend
        run: npm run lint
        working-directory: src/Prdb.Ordeno.Frontend

      # Compiles the frontend against the committed types, which is where a
      # response shape it relies on having changed turns into an error.
      - name: Build the frontend
        run: npm run build
        working-directory: src/Prdb.Ordeno.Frontend

  # Docker is the supported way to run this, so a broken image is a broken
  # release regardless of what the tests above say. The image is built for both
  # published architectures and started on both, because the claims worth
  # checking — that it drops to PUID:PGID, that it leaves the media alone, that
  # it stops when it is asked to — are only true or false in a running
  # container.
  image:
    name: Build the image and start it on both architectures
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Everything expensive in the build runs on the runner's own
      # architecture; this is here for the runtime stage and for starting the
      # arm64 image afterwards.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # ADR 0011 leaves open whether emulated arm64 builds are fast enough to
      # keep. Both builds are timed so that the answer is a measurement in every
      # run rather than an assumption, and the numbers land in the job summary
      # where they can be read without opening the log.
      #
      # The first of the two pays for everything: npm, the .NET publish, and the
      # runtime stage. The second reuses the stages the first built, because
      # they are the same on both architectures by design — which is exactly
      # what a multi-platform publish does in one invocation, so the second
      # number is what arm64 actually costs on top of amd64 rather than an
      # inflated one from a cold cache.
      - name: Build for linux/amd64
        run: |
          started=$(date +%s)
          docker buildx build --platform linux/amd64 --load --tag ordeno:amd64 .
          echo "amd64_seconds=$(($(date +%s) - started))" >> "$GITHUB_ENV"

      - name: Build for linux/arm64
        run: |
          started=$(date +%s)
          docker buildx build --platform linux/arm64 --load --tag ordeno:arm64 .
          echo "arm64_seconds=$(($(date +%s) - started))" >> "$GITHUB_ENV"

      - name: Start the linux/amd64 image
        run: docker/smoke-test.sh ordeno:amd64

      # Under QEMU, which is the slow part: this is the emulation the
      # measurement above is about, exercised rather than assumed.
      - name: Start the linux/arm64 image
        run: docker/smoke-test.sh ordeno:arm64

      - name: How long the builds took
        if: always()
        run: |
          {
            echo "| Build | Seconds |"
            echo "| --- | --- |"
            echo "| linux/amd64, everything | ${amd64_seconds:-?} |"
            echo "| linux/arm64 on top of it, emulated runtime stage | ${arm64_seconds:-?} |"
          } >> "$GITHUB_STEP_SUMMARY"
